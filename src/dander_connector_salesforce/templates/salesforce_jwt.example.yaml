# Read-only Salesforce CRM connector. Contact Email and Phone are personal data; keep credentials
# and extracted data within approved systems. Add custom fields to both query and raw_schema.
name: salesforce
engine: salesforce_bulk2
base_url: https://YOUR_DOMAIN.my.salesforce.com/services/data/v67.0
auth_strategy: oauth2_jwt
auth_refs:
  issuer: SALESFORCE_EXTERNAL_CLIENT_APP_ID
  private_key: SALESFORCE_EXTERNAL_CLIENT_APP_PRIVATE_KEY
auth_options:
  token_url: https://login.salesforce.com/services/oauth2/token
  audience: https://login.salesforce.com
  subject: integration-user@example.com
  assertion_lifetime: 120
  default_expires_in: 300
rate_limit:
  requests_per_second: 5
  burst: 2
  backoff: exponential
  max_retries: 4

endpoints:
  - name: accounts
    path: /jobs/query
    pagination:
      kind: header_cursor
      next_cursor_header: Sforce-Locator
      cursor_param: locator
      size_param: maxRecords
      page_size: 10000
      terminal_value: "null"
    request_body:
      operation: queryAll
      query: >-
        SELECT Id, Name, OwnerId, ParentId, Type, Industry, AnnualRevenue,
        NumberOfEmployees, Website, Phone, BillingCity, BillingState,
        BillingPostalCode, BillingCountry, CreatedDate, LastModifiedDate,
        SystemModstamp, IsDeleted FROM Account
      contentType: CSV
      columnDelimiter: COMMA
      lineEnding: LF
    primary_key: [Id]
    incremental_cursor: SystemModstamp
    raw_schema:
      # Retained for schema compatibility with the original Accounts connector; Bulk CSV rows do
      # not populate the REST-only attributes envelope.
      - name: attributes
        type: RECORD
        fields:
          - {name: type, type: STRING}
          - {name: url, type: STRING}
      - {name: Id, type: STRING, mode: REQUIRED}
      - {name: Name, type: STRING, mode: REQUIRED}
      - {name: OwnerId, type: STRING}
      - {name: ParentId, type: STRING}
      - {name: Type, type: STRING}
      - {name: Industry, type: STRING}
      - {name: AnnualRevenue, type: NUMERIC}
      - {name: NumberOfEmployees, type: INT64}
      - {name: Website, type: STRING}
      - {name: Phone, type: STRING}
      - {name: BillingCity, type: STRING}
      - {name: BillingState, type: STRING}
      - {name: BillingPostalCode, type: STRING}
      - {name: BillingCountry, type: STRING}
      - {name: CreatedDate, type: TIMESTAMP, mode: REQUIRED}
      - {name: LastModifiedDate, type: TIMESTAMP, mode: REQUIRED}
      - {name: SystemModstamp, type: TIMESTAMP, mode: REQUIRED}
      - {name: IsDeleted, type: BOOL, mode: REQUIRED}

  - name: contacts
    path: /jobs/query
    pagination:
      kind: header_cursor
      next_cursor_header: Sforce-Locator
      cursor_param: locator
      size_param: maxRecords
      page_size: 10000
      terminal_value: "null"
    request_body:
      operation: queryAll
      query: >-
        SELECT Id, AccountId, OwnerId, FirstName, LastName, Name, Email, Phone,
        Title, Department, MailingCity, MailingState, MailingPostalCode,
        MailingCountry, CreatedDate, LastModifiedDate, SystemModstamp, IsDeleted
        FROM Contact
      contentType: CSV
      columnDelimiter: COMMA
      lineEnding: LF
    primary_key: [Id]
    incremental_cursor: SystemModstamp
    raw_schema:
      - {name: Id, type: STRING, mode: REQUIRED}
      - {name: AccountId, type: STRING}
      - {name: OwnerId, type: STRING}
      - {name: FirstName, type: STRING}
      - {name: LastName, type: STRING, mode: REQUIRED}
      - {name: Name, type: STRING, mode: REQUIRED}
      - {name: Email, type: STRING}
      - {name: Phone, type: STRING}
      - {name: Title, type: STRING}
      - {name: Department, type: STRING}
      - {name: MailingCity, type: STRING}
      - {name: MailingState, type: STRING}
      - {name: MailingPostalCode, type: STRING}
      - {name: MailingCountry, type: STRING}
      - {name: CreatedDate, type: TIMESTAMP, mode: REQUIRED}
      - {name: LastModifiedDate, type: TIMESTAMP, mode: REQUIRED}
      - {name: SystemModstamp, type: TIMESTAMP, mode: REQUIRED}
      - {name: IsDeleted, type: BOOL, mode: REQUIRED}

  - name: opportunities
    path: /jobs/query
    pagination:
      kind: header_cursor
      next_cursor_header: Sforce-Locator
      cursor_param: locator
      size_param: maxRecords
      page_size: 10000
      terminal_value: "null"
    request_body:
      operation: queryAll
      query: >-
        SELECT Id, AccountId, OwnerId, Name, StageName, Amount, Probability,
        CloseDate, Type, LeadSource, ForecastCategoryName, IsClosed, IsWon,
        CreatedDate, LastModifiedDate, SystemModstamp, IsDeleted FROM Opportunity
      contentType: CSV
      columnDelimiter: COMMA
      lineEnding: LF
    primary_key: [Id]
    incremental_cursor: SystemModstamp
    raw_schema:
      - {name: Id, type: STRING, mode: REQUIRED}
      - {name: AccountId, type: STRING}
      - {name: OwnerId, type: STRING}
      - {name: Name, type: STRING, mode: REQUIRED}
      - {name: StageName, type: STRING, mode: REQUIRED}
      - {name: Amount, type: NUMERIC}
      - {name: Probability, type: NUMERIC}
      - {name: CloseDate, type: DATE, mode: REQUIRED}
      - {name: Type, type: STRING}
      - {name: LeadSource, type: STRING}
      - {name: ForecastCategoryName, type: STRING}
      - {name: IsClosed, type: BOOL, mode: REQUIRED}
      - {name: IsWon, type: BOOL, mode: REQUIRED}
      - {name: CreatedDate, type: TIMESTAMP, mode: REQUIRED}
      - {name: LastModifiedDate, type: TIMESTAMP, mode: REQUIRED}
      - {name: SystemModstamp, type: TIMESTAMP, mode: REQUIRED}
      - {name: IsDeleted, type: BOOL, mode: REQUIRED}

  - name: users
    path: /jobs/query
    pagination:
      kind: header_cursor
      next_cursor_header: Sforce-Locator
      cursor_param: locator
      size_param: maxRecords
      page_size: 10000
      terminal_value: "null"
    request_body:
      operation: query
      query: >-
        SELECT Id, Name, Alias, UserType, ProfileId, IsActive, CreatedDate,
        LastModifiedDate, SystemModstamp FROM User
      contentType: CSV
      columnDelimiter: COMMA
      lineEnding: LF
    primary_key: [Id]
    incremental_cursor: SystemModstamp
    raw_schema:
      - {name: Id, type: STRING, mode: REQUIRED}
      - {name: Name, type: STRING, mode: REQUIRED}
      - {name: Alias, type: STRING, mode: REQUIRED}
      - {name: UserType, type: STRING, mode: REQUIRED}
      - {name: ProfileId, type: STRING, mode: REQUIRED}
      - {name: IsActive, type: BOOL, mode: REQUIRED}
      - {name: CreatedDate, type: TIMESTAMP, mode: REQUIRED}
      - {name: LastModifiedDate, type: TIMESTAMP, mode: REQUIRED}
      - {name: SystemModstamp, type: TIMESTAMP, mode: REQUIRED}
