name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Install exact Dander write-back contract
        run: |
          uv pip install --python .venv/bin/python --reinstall \
            "dander-platform @ git+https://github.com/harrisonoconnorhover/dander.git@3a9569d895656870903b33c426b69f8125f32daa"
      - run: uv run --no-sync mypy src tests
      - run: uv run --no-sync pytest
      - name: Dependency audit
        run: |
          uv export --frozen --format requirements.txt --no-dev --no-emit-project \
            --output-file /tmp/salesforce-connector-requirements.txt
          uv run --with pip-audit pip-audit --strict \
            -r /tmp/salesforce-connector-requirements.txt

  distribution:
    name: Distribution install
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv build
      - name: Install and discover outside checkout
        run: |
          TEMP_DIR="$(mktemp -d)"
          uv venv "$TEMP_DIR/venv"
          uv pip install --python "$TEMP_DIR/venv/bin/python" \
            "dander-platform @ git+https://github.com/harrisonoconnorhover/dander.git@3a9569d895656870903b33c426b69f8125f32daa"
          uv pip install --python "$TEMP_DIR/venv/bin/python" --no-deps dist/*.whl
          cd "$TEMP_DIR"
          "$TEMP_DIR/venv/bin/python" -c \
            'from dander_connector_salesforce import create_plugin; assert create_plugin().engine == "salesforce_bulk2"'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
